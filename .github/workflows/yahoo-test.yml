name: Yahoo realtime nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Yahoo test
        run: node scripts/fetch_yahoo.mjs

      - name: Calculate Heat
        run: node scripts/calculate_heat.mjs

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yahoo_posts.json data/mood_data.json
          git diff --cached --quiet || git commit -m "Update Yahoo mood data"
          git push
