<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MoodScope</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      color: #202124;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    header {
      background: #ffffff;
      padding: 24px 18px 18px;
      border-bottom: 1px solid #e5e7eb;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .top-info {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #e5e7eb;
    }

    .updated {
      font-size: 12px;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #6b7280;
    }

    .error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .stock-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stock-name {
      font-size: 20px;
      font-weight: 800;
    }

    .symbol {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 3px;
    }

    .direction {
      font-size: 12px;
      font-weight: 700;
      padding: 6px 9px;
      border-radius: 999px;
      background: #f3f4f6;
      white-space: nowrap;
    }

    .direction.up {
      background: #ecfdf5;
      color: #047857;
    }

    .direction.down {
      background: #fff1f2;
      color: #be123c;
    }

    .direction.flat {
      background: #f3f4f6;
      color: #6b7280;
    }

    .price-area {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 16px;
    }

    .price {
      font-size: 28px;
      font-weight: 800;
    }

    .change {
      font-size: 16px;
      font-weight: 700;
    }

    .change.up {
      color: #047857;
    }

    .change.down {
      color: #be123c;
    }

    .change.flat {
      color: #6b7280;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .metric {
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px;
    }

    .metric-label {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 17px;
      font-weight: 800;
    }

    .mood-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px;
      border: 1px dashed #d1d5db;
    }

    .mood-title {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .mood-value {
      font-size: 18px;
      font-weight: 800;
    }

    .mood-note {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 3px;
    }

    .signal {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 700;
    }

    .footer-note {
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
      padding: 20px 0 40px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      .metrics {
        grid-template-columns: 1fr 1fr;
      }

      .metrics .metric:last-child {
        grid-column: span 2;
      }

      .price {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="title">MoodScope</div>
  <div class="subtitle">SNS投資心理・独自分析</div>
</header>

<main class="container">

  <div id="error"></div>

  <div class="top-info">
    <div id="updated" class="updated">
      データ読み込み中...
    </div>
  </div>

  <div id="loading" class="loading">
    データを読み込んでいます...
  </div>

  <div id="stocks"></div>

  <div class="footer-note">
    株価データ：Yahoo! Finance<br>
    投稿数：Yahoo!リアルタイム検索<br>
    Moodは感情データ取得方式を確認後に実装予定
  </div>

</main>

<script>

const moodUrl =
  "./data/mood_data.json?ts=" + Date.now();

const priceUrl =
  "./data/price_signal.json?ts=" + Date.now();

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatNumber(value) {
  if (value == null) return "—";

  return Number(value).toLocaleString("ja-JP");
}

function formatPercent(value) {
  if (value == null) return "—";

  const sign = value > 0 ? "+" : "";

  return sign +
    Number(value).toFixed(2) +
    "%";
}

function getDirectionClass(direction) {
  if (direction === "上昇") return "up";
  if (direction === "下落") return "down";
  return "flat";
}

function createStockCard(mood, price) {

  const keyword =
    price?.keyword ||
    mood?.keyword ||
    "不明";

  const symbol =
    price?.symbol ||
    "—";

  const close =
    price?.close ?? null;

  const changePct =
    price?.changePct ?? null;

  const direction =
    price?.direction || "判定不可";

  const directionClass =
    getDirectionClass(direction);

  const posts =
    mood?.posts24h ?? null;

  const baseline =
    mood?.baselinePosts24h ?? null;

  const heat =
    mood?.heat ?? null;

  const heatText =
    heat == null ? "—" : heat;

  return `
    <section class="stock-card">

      <div class="stock-header">

        <div>
          <div class="stock-name">
            ${escapeHtml(keyword)}
          </div>

          <div class="symbol">
            ${escapeHtml(symbol)}
          </div>
        </div>

        <div class="direction ${directionClass}">
          ${escapeHtml(direction)}
        </div>

      </div>

      <div class="price-area">

        <div class="price">
          ${formatNumber(close)}円
        </div>

        <div class="change ${directionClass}">
          ${formatPercent(changePct)}
        </div>

      </div>

      <div class="metrics">

        <div class="metric">
          <div class="metric-label">
            投稿数24h
          </div>

          <div class="metric-value">
            ${formatNumber(posts)}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">
            基準投稿数
          </div>

          <div class="metric-value">
            ${formatNumber(baseline)}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">
            Heat
          </div>

          <div class="metric-value">
            ${heatText}
          </div>
        </div>

      </div>

      <div class="mood-box">

        <div class="mood-title">
          Mood
        </div>

        <div class="mood-value">
          —
        </div>

        <div class="mood-note">
          感情データ取得方式を確認中
        </div>

      </div>

      ${
        direction === "上昇"
          ? `
            <div class="signal">
              株価上昇
            </div>
          `
          : ""
      }

    </section>
  `;
}

async function loadData() {

  const loading =
    document.getElementById("loading");

  const stocksElement =
    document.getElementById("stocks");

  const errorElement =
    document.getElementById("error");

  try {

    const [
      moodResponse,
      priceResponse
    ] = await Promise.all([

      fetch(moodUrl, {
        cache: "no-store"
      }),

      fetch(priceUrl, {
        cache: "no-store"
      })

    ]);

    if (!moodResponse.ok) {
      throw new Error(
        "mood_data.json の取得に失敗しました"
      );
    }

    if (!priceResponse.ok) {
      throw new Error(
        "price_signal.json の取得に失敗しました"
      );
    }

    const moodData =
      await moodResponse.json();

    const priceData =
      await priceResponse.json();

    const moodMap = new Map();

    for (const stock of (
      moodData.stocks || []
    )) {
      moodMap.set(
        stock.keyword,
        stock
      );
    }

    const priceStocks =
      priceData.stocks || [];

    stocksElement.innerHTML =
      priceStocks.map(price => {

        const mood =
          moodMap.get(price.keyword) || null;

        return createStockCard(
          mood,
          price
        );

      }).join("");

    loading.style.display = "none";

    const updated =
      document.getElementById("updated");

    const date =
      priceData.updatedAt ||
      moodData.updatedAt;

    if (date) {

      const d =
        new Date(date);

      updated.textContent =
        "最終更新: " +
        d.toLocaleString(
          "ja-JP",
          {
            timeZone: "Asia/Tokyo"
          }
        );
    }

    if (priceStocks.length === 0) {

      stocksElement.innerHTML =
        `<div class="loading">
          株価データがありません
        </div>`;
    }

  } catch (error) {

    console.error(error);

    loading.style.display = "none";

    errorElement.innerHTML =
      `<div class="error">
        データ取得エラー：${escapeHtml(error.message)}
      </div>`;
  }
}

loadData();

</script>

</body>
</html>
