name: Yahoo realtime nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Yahoo multi-stock fetch
        run: node scripts/fetch_yahoo.mjs

      - name: Calculate Heat
        run: node scripts/calculate_heat.mjs

      - name: Run Yahoo price fetch
        run: node scripts/fetch_prices.mjs

      - name: Calculate Price Signal
        run: node scripts/calculate_price_signal.mjs

      - name: Test Yahoo sentiment data
        run: node scripts/test_yahoo_sentiment.mjs

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Fetch Yahoo 24-hour sentiment
        run: node scripts/fetch_yahoo_sentiment.mjs

      - name: Calculate Mood
        run: node scripts/calculate_mood.mjs

      - name: Save Mood History
        run: node scripts/save_mood_history.mjs

      - name: Calculate Mood Change
        run: node scripts/calculate_mood_change.mjs

      - name: Capture Yahoo network
        run: node scripts/capture_yahoo_network.mjs

      - name: Probe Yahoo sentiment v3
        run: node scripts/test_yahoo_sentiment_v3.mjs

      - name: Probe Yahoo sentiment v2
        run: node scripts/test_yahoo_sentiment_v2.mjs

      - name: Probe Yahoo page
        run: node scripts/test_yahoo_page.mjs

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yahoo_posts.json data/mood_data.json data/yahoo_prices.json data/price_signal.json data/yahoo_sentiment.json data/mood_result.json data/mood_history.json data/mood_change.json
          git diff --cached --quiet || git commit -m "Update Yahoo mood, price, sentiment and history data"
          git push
