<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MoodScope</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px 40px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
      background: #f4f6f9;
      color: #172033;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      padding: 12px 4px 24px;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 15px;
      color: #687386;
    }

    .summary {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow:
        0 8px 25px rgba(20, 30, 50, 0.06);
    }

    .summary-title {
      font-size: 14px;
      color: #7a8495;
      margin-bottom: 5px;
    }

    .summary-value {
      font-size: 25px;
      font-weight: 800;
    }

    .signal-panel {
      background: #fff;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow:
        0 8px 25px rgba(20, 30, 50, 0.06);
    }

    .signal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .signal-empty {
      background: #f5f7fa;
      border-radius: 14px;
      padding: 15px;
      color: #727c8d;
    }

    .signal-card {
      border-radius: 16px;
      padding: 15px;
      margin-top: 12px;
      background: #f5f7fa;
    }

    .signal-card.high {
      border-left: 5px solid #d62828;
    }

    .signal-card.medium {
      border-left: 5px solid #e09b00;
    }

    .signal-stock {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .signal-priority {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
      background: #e9edf3;
    }

    .signal-card.high .signal-priority {
      background: #fde4e4;
      color: #b51f1f;
    }

    .signal-card.medium .signal-priority {
      background: #fff1cc;
      color: #946400;
    }

    .signal-metrics {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .signal-metric {
      background: white;
      border-radius: 10px;
      padding: 9px;
    }

    .signal-metric-label {
      font-size: 11px;
      color: #7a8495;
      margin-bottom: 3px;
    }

    .signal-metric-value {
      font-size: 16px;
      font-weight: 800;
    }

    .signal-list {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.7;
    }

    .stock-card {
      background: white;
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow:
        0 8px 25px rgba(20, 30, 50, 0.06);
    }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stock-name {
      font-size: 23px;
      font-weight: 800;
      line-height: 1.3;
    }

    .price-area {
      text-align: right;
      flex-shrink: 0;
    }

    .price {
      font-size: 27px;
      font-weight: 800;
    }

    .change {
      font-size: 17px;
      font-weight: 800;
      margin-top: 2px;
    }

    .up {
      color: #16833b;
    }

    .down {
      color: #c62828;
    }

    .flat {
      color: #687386;
    }

    .mood-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f4f6f9;
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }

    .mood-label {
      font-size: 14px;
      color: #788293;
      margin-bottom: 4px;
    }

    .mood-name {
      font-size: 20px;
      font-weight: 800;
    }

    .mood-number {
      font-size: 40px;
      font-weight: 900;
    }

    .mood-positive {
      color: #16833b;
    }

    .mood-negative {
      color: #c62828;
    }

    .mood-neutral {
      color: #687386;
    }

    .metrics {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .metric {
      background: #f7f8fa;
      border-radius: 15px;
      padding: 14px;
    }

    .metric-label {
      font-size: 13px;
      color: #788293;
      margin-bottom: 5px;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 800;
    }

    .sentiment-title {
      font-size: 14px;
      color: #788293;
      margin-bottom: 8px;
    }

    .sentiment-bar {
      display: flex;
      width: 100%;
      height: 23px;
      border-radius: 999px;
      overflow: hidden;
      background: #ddd;
    }

    .negative-bar {
      background: #d94b4b;
    }

    .positive-bar {
      background: #3d82e8;
    }

    .sentiment-labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-top: 7px;
      color: #687386;
    }

    .status {
      margin-top: 14px;
      background: #f4f6f9;
      border-radius: 13px;
      padding: 12px 14px;
      font-weight: 700;
      color: #687386;
    }

    .footer {
      text-align: center;
      color: #8a93a2;
      font-size: 12px;
      line-height: 1.7;
      padding: 12px;
    }

    @media (max-width: 520px) {

      body {
        padding: 14px 10px 30px;
      }

      .stock-card {
        padding: 18px;
      }

      .stock-name {
        font-size: 20px;
      }

      .price {
        font-size: 23px;
      }

      .signal-metrics {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="title">
        MoodScope
      </div>

      <div class="subtitle">
        SNS投資心理・独自分析
      </div>
    </div>

    <div class="summary">
      <div class="summary-title">
        現在の分析対象
      </div>

      <div
        class="summary-value"
        id="stockCount"
      >
        読み込み中
      </div>
    </div>

    <div class="signal-panel">

      <div class="signal-title">
        独自シグナル
      </div>

      <div
        id="signalArea"
        class="signal-empty"
      >
        シグナルを読み込み中...
      </div>

    </div>

    <div id="stocks">
      読み込み中...
    </div>

    <div class="footer">
      Yahoo! Finance / Yahoo!リアルタイムを利用<br>
      MoodScope独自分析
      <br><br>
      最終更新:
      <span id="updatedAt">
        --
      </span>
    </div>

  </div>

  <script>

    const timestamp =
      Date.now();

    const moodUrl =
      "./data/mood_result.json?ts=" +
      timestamp;

    const priceUrl =
      "./data/price_signal.json?ts=" +
      timestamp;

    const signalUrl =
      "./data/signals.json?ts=" +
      timestamp;

    Promise.all([
      fetch(moodUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(
              "mood_result.json error"
            );
          }

          return response.json();
        }),

      fetch(priceUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(
              "price_signal.json error"
            );
          }

          return response.json();
        }),

      fetch(signalUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(
              "signals.json error"
            );
          }

          return response.json();
        })
    ])

    .then(
      ([
        moodData,
        priceData,
        signalData
      ]) => {

        const moods =
          moodData.stocks || [];

        const prices =
          priceData.stocks || [];

        const signals =
          signalData.stocks || [];

        const stockMap =
          new Map();

        for (
          const mood
          of moods
        ) {

          stockMap.set(
            mood.keyword,
            {
              ...mood
            }
          );

        }

        for (
          const price
          of prices
        ) {

          const stock =
            stockMap.get(
              price.keyword
            );

          if (stock) {

            stock.price =
              price.close;

            stock.changePct =
              price.changePct;

            stock.direction =
              price.direction;

          }

        }

        const stocks =
          Array.from(
            stockMap.values()
          );

        document
          .getElementById(
            "stockCount"
          )
          .textContent =
          stocks.length +
          "銘柄";

        renderSignals(
          signals
        );

        renderStocks(
          stocks
        );

        const updated =
          moodData.updatedAt ||
          signalData.updatedAt;

        if (updated) {

          const date =
            new Date(updated);

          document
            .getElementById(
              "updatedAt"
            )
            .textContent =
            date.toLocaleString(
              "ja-JP"
            );

        }

      }
    )

    .catch(error => {

      console.error(error);

      document
        .getElementById(
          "stocks"
        )
        .innerHTML = `
          <div class="summary">
            データの読み込みに失敗しました。<br>
            少し時間を置いて再読み込みしてください。
          </div>
        `;

      document
        .getElementById(
          "signalArea"
        )
        .textContent =
        "シグナルを読み込めませんでした。";

    });


    function renderSignals(
      signals
    ) {

      const area =
        document.getElementById(
          "signalArea"
        );

      const active =
        signals
          .filter(
            stock =>
              Array.isArray(
                stock.signals
              ) &&
              stock.signals.length > 0
          )
          .sort(
            (a, b) => {

              const rank = {
                "高": 3,
                "中": 2,
                "通常": 1
              };

              return (
                (rank[b.priority] || 0) -
                (rank[a.priority] || 0)
              );

            }
          );

      if (
        active.length === 0
      ) {

        area.innerHTML = `
          <div class="signal-empty">
            現在、該当する独自シグナルはありません。
          </div>
        `;

        return;
      }

      area.innerHTML =
        active
          .map(stock => {

            const priorityClass =
              stock.priority === "高"
                ? "high"
                : stock.priority === "中"
                  ? "medium"
                  : "";

            const mood =
              formatNumber(
                stock.currentMood
              );

            const moodChange =
              formatSignedNumber(
                stock.moodChange
              );

            const priceChange =
              formatSignedNumber(
                stock.priceChangePct
              );

            return `
              <div
                class="signal-card ${priorityClass}"
              >

                <div class="signal-stock">
                  ${escapeHtml(
                    stock.keyword
                  )}
                </div>

                <div class="signal-priority">
                  優先度：${escapeHtml(
                    stock.priority
                  )}
                </div>

                <div class="signal-metrics">

                  <div class="signal-metric">
                    <div class="signal-metric-label">
                      Mood
                    </div>
                    <div class="signal-metric-value">
                      ${mood}
                    </div>
                  </div>

                  <div class="signal-metric">
                    <div class="signal-metric-label">
                      Mood変化
                    </div>
                    <div class="signal-metric-value">
                      ${moodChange}
                    </div>
                  </div>

                  <div class="signal-metric">
                    <div class="signal-metric-label">
                      株価変化
                    </div>
                    <div class="signal-metric-value">
                      ${priceChange}%
                    </div>
                  </div>

                </div>

                <div class="signal-list">
                  ${stock.signals
                    .map(
                      signal =>
                        "・" +
                        escapeHtml(
                          signal
                        )
                    )
                    .join("<br>")}
                </div>

              </div>
            `;

          })
          .join("");

    }


    function renderStocks(
      stocks
    ) {

      const container =
        document.getElementById(
          "stocks"
        );

      if (
        stocks.length === 0
      ) {

        container.innerHTML = `
          <div class="summary">
            株価データがありません。
          </div>
        `;

        return;
      }

      container.innerHTML =
        stocks
          .map(stock =>
            createStockCard(
              stock
            )
          )
          .join("");

    }


    function createStockCard(
      stock
    ) {

      const mood =
        stock.mood ??
        null;

      const label =
        stock.label ||
        "判定不可";

      const price =
        stock.price;

      const changePct =
        stock.changePct;

      const negative =
        Number(
          stock.negative ?? 0
        );

      const positive =
        Number(
          stock.positive ?? 0
        );

      const total =
        negative +
        positive;

      let negativeWidth =
        50;

      let positiveWidth =
        50;

      if (total > 0) {

        negativeWidth =
          (
            negative /
            total *
            100
          );

        positiveWidth =
          (
            positive /
            total *
            100
          );

      }

      const moodClass =
        mood === null
          ? "mood-neutral"
          : mood > 0
            ? "mood-positive"
            : mood < 0
              ? "mood-negative"
              : "mood-neutral";

      const changeClass =
        changePct === null ||
        changePct === undefined
          ? "flat"
          : changePct > 0
            ? "up"
            : changePct < 0
              ? "down"
              : "flat";

      const priceText =
        price === null ||
        price === undefined
          ? "--"
          : Number(
              price
            ).toLocaleString(
              "ja-JP"
            ) + "円";

      const changeText =
        changePct === null ||
        changePct === undefined
          ? "--"
          : (
              changePct > 0
                ? "+"
                : ""
            ) +
            Number(
              changePct
            ).toFixed(2) +
            "%";

      const moodText =
        mood === null ||
        mood === undefined
          ? "--"
          : mood;

      const postsText =
        stock.posts24h === null ||
        stock.posts24h === undefined
          ? "--"
          : Number(
              stock.posts24h
            ).toLocaleString(
              "ja-JP"
            );

      const heatText =
        stock.heat === null ||
        stock.heat === undefined
          ? "蓄積中"
          : stock.heat;

      const baselineText =
        stock.bas
